<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5d6b78"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9d2da; stroke-width: 2; rx: 12; }
      .core { fill: #e3f3f1; stroke: #0f766e; stroke-width: 2.5; }
      .t { font-size: 22px; font-weight: 700; fill: #17212b; }
      .s { font-size: 16px; fill: #5d6b78; }
      .n { font-size: 15px; fill: #0f766e; font-weight: 600; }
      .l { stroke: #5d6b78; stroke-width: 2.2; fill: none; marker-end: url(#a); }
      .lbl { font-size: 14px; fill: #5d6b78; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f4f6f8"/>
  <text x="40" y="58" font-size="34" font-weight="800" fill="#17212b">Relay on AWS</text>
  <text x="40" y="90" class="s">Every service maps to a rule in the brief. No patient information is stored anywhere.</text>

  <!-- Sources -->
  <rect x="40" y="150" width="270" height="110" class="box"/>
  <text x="60" y="190" class="t">Synapse events</text>
  <text x="60" y="218" class="s">event_stream CSV, new files</text>
  <text x="60" y="240" class="s">(production: Amazon Kinesis)</text>

  <rect x="40" y="320" width="270" height="110" class="box"/>
  <text x="60" y="360" class="t">Judge drops a file</text>
  <text x="60" y="388" class="s">web upload (presigned URL)</text>
  <text x="60" y="410" class="s">or straight into S3</text>

  <!-- S3 -->
  <rect x="380" y="200" width="300" height="190" class="box"/>
  <text x="400" y="240" class="t">Amazon S3</text>
  <text x="400" y="266" class="n">event data lake (versioned, KMS)</text>
  <text x="400" y="294" class="s">kit/  raw/  processed/  manifests/</text>
  <text x="400" y="320" class="s">raw/ never overwritten</text>
  <text x="400" y="346" class="s">to S3 Glacier after 30 days</text>

  <!-- Lambda ingest -->
  <rect x="380" y="460" width="300" height="120" class="box"/>
  <text x="400" y="500" class="t">AWS Lambda</text>
  <text x="400" y="526" class="n">relay-ingest</text>
  <text x="400" y="552" class="s">check 8 columns, manifest, reload</text>

  <!-- App Runner core -->
  <rect x="760" y="230" width="380" height="330" rx="16" class="core"/>
  <text x="785" y="275" class="t">AWS App Runner</text>
  <text x="785" y="301" class="n">Relay engine + web app (image in Amazon ECR)</text>
  <text x="785" y="338" class="s">Replay by event time: dedupe, late events</text>
  <text x="785" y="364" class="s">Detect: standards, surge, coverage +90 min</text>
  <text x="785" y="390" class="s">Decide: routing model, ladder, eligibility</text>
  <text x="785" y="416" class="s">Act: offers, expiry, two acceptances</text>
  <text x="785" y="452" class="n">Coordinator | Clinical lead | Doctor phone</text>
  <text x="785" y="488" class="s">Privacy guard on every message</text>
  <text x="785" y="514" class="s">Matched Sevaro's 6:20 PM snapshot exactly</text>

  <!-- DynamoDB -->
  <rect x="1220" y="150" width="340" height="120" class="box"/>
  <text x="1240" y="190" class="t">Amazon DynamoDB</text>
  <text x="1240" y="216" class="n">relay-actions, relay-audit</text>
  <text x="1240" y="242" class="s">first acceptance wins (conditional write)</text>

  <!-- SNS -->
  <rect x="1220" y="310" width="340" height="120" class="box"/>
  <text x="1240" y="350" class="t">Amazon SNS</text>
  <text x="1240" y="376" class="n">relay-offers, coordinator alerts</text>
  <text x="1240" y="402" class="s">guarded offer text to the doctor's phone</text>

  <!-- Bedrock -->
  <rect x="1220" y="470" width="340" height="110" class="box"/>
  <text x="1240" y="510" class="t">Amazon Bedrock</text>
  <text x="1240" y="536" class="s">two-line summary for the clinical lead</text>
  <text x="1240" y="558" class="s">from structured fields; template fallback</text>

  <!-- Scheduler -->
  <rect x="760" y="640" width="380" height="110" class="box"/>
  <text x="785" y="680" class="t">EventBridge Scheduler</text>
  <text x="785" y="706" class="n">every minute: Lambda relay-tick</text>
  <text x="785" y="730" class="s">offer expiry, backup approver, no-shows</text>

  <!-- CloudWatch -->
  <rect x="1220" y="640" width="340" height="110" class="box"/>
  <text x="1240" y="680" class="t">Amazon CloudWatch</text>
  <text x="1240" y="706" class="n">metrics + feed-quiet alarm</text>
  <text x="1240" y="730" class="s">no events for 10 min: alert via SNS</text>

  <!-- Security -->
  <rect x="40" y="640" width="640" height="110" class="box"/>
  <text x="60" y="680" class="t">Security</text>
  <text x="60" y="708" class="s">AWS KMS encryption at rest, AWS Secrets Manager for secrets and keys,</text>
  <text x="60" y="732" class="s">least-privilege AWS IAM roles, AWS CloudTrail. Deployed with AWS CDK (Python).</text>

  <!-- arrows -->
  <path class="l" d="M310 205 H380"/>
  <path class="l" d="M310 375 H345 V300 H380"/>
  <path class="l" d="M530 390 V460"/>
  <path class="l" d="M680 520 H720 V430 H760"/>
  <text x="690" y="510" class="lbl">reload</text>
  <path class="l" d="M760 300 H720 V280 H680"/>
  <text x="686" y="322" class="lbl">read, write</text>
  <path class="l" d="M1140 260 H1180 V210 H1220"/>
  <path class="l" d="M1140 370 H1220"/>
  <path class="l" d="M1140 500 H1180 V525 H1220"/>
  <path class="l" d="M950 640 V560"/>
  <path class="l" d="M1140 520 H1170 V695 H1220"/>
  <text x="1150" y="610" class="lbl">metrics</text>
  <path class="l" d="M1560 695 H1585 V370 H1562"/>
</svg>
